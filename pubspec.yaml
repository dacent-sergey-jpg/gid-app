name: gid_app
description: "AI Audio Guide Mobile Application for Vologda"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1
  audioplayers: ^6.0.0
  geolocator: ^12.0.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  camera: ^0.11.0
  shared_preferences: ^2.3.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
