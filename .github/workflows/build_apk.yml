name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Ensure required directories exist
        run: mkdir -p assets/images

      - name: Generate Android project, Update SDK 34 & Add Permissions
        run: |
          flutter create --platforms=android .
          
          # Удаляем автосгенерированный шаблонный тест, чтобы он не ломал analyzer
          rm -rf test

          GRADLE_FILE=$(find android/app -name "build.gradle*" | head -n 1)

          sed -i -E 's/(compileSdk|compileSdkVersion).*/compileSdk = 34/' "$GRADLE_FILE"
          sed -i -E 's/(targetSdk|targetSdkVersion).*/targetSdk = 34/' "$GRADLE_FILE"

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' $MANIFEST
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' $MANIFEST

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GID-MVP-Release
          path: build/app/outputs/flutter-apk/app-release.apk
