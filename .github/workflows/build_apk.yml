name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Recreate Android platform folder
        run: flutter create --platforms=android .

      - name: Set compileSdk to 36
        run: |
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle 2>/dev/null || true
          sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts 2>/dev/null || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
