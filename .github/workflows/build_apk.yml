name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create missing assets directory
        run: mkdir -p assets/images

      - name: Recreate Android platform folder
        run: flutter create --platforms=android .

      - name: Configure Android SDK 36 for app and plugins
        run: |
          # 1. Обновляем главный модуль приложения
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/compileSdk .*/compileSdk 36/' android/app/build.gradle
          fi

          # 2. Переопределяем SDK для всех зависимых плагинов в корневом файле
          if [ -f "android/build.gradle.kts" ]; then
            cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              afterEvaluate {
                  val android = extensions.findByName("android")
                  if (android != null) {
                      try {
                          val method = android.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType)
                          method.invoke(android, 36)
                      } catch (e: Exception) {
                          // Игнорируем, если проект не является Android-модулем
                      }
                  }
              }
          }
          EOF
          elif [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
