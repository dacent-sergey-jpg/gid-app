name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create missing assets directory
        run: mkdir -p assets/images

      - name: Recreate Android platform folder
        run: flutter create --platforms=android .

      - name: Add Android Permissions to Manifest
        run: |
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          permissions = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\"/>
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\"/>
          '''
          content = content.replace('<application', permissions + '\n    <application')
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Configure Android SDK 36 for app and plugins
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/compileSdk .*/compileSdk 36/' android/app/build.gradle
          fi

          if [ -f "android/build.gradle.kts" ]; then
            cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              val updateSdk = {
                  val android = extensions.findByName("android")
                  if (android != null) {
                      try {
                          val method = android.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType)
                          method.invoke(android, 36)
                      } catch (e: Exception) {
                          // Ignore
                      }
                  }
              }
              if (state.executed) {
                  updateSdk()
              } else {
                  afterEvaluate { updateSdk() }
              }
          }
          EOF
          elif [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle

          subprojects {
              def updateSdk = {
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
              if (project.state.executed) {
                  updateSdk()
              } else {
                  project.afterEvaluate {
                      updateSdk()
                  }
              }
          }
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
